<div class="d-flex flex-column flex-lg-row justify-content-between align-items-start ">
  <!-- Sección de fichajes -->
  <main class="col-12 px-4 ">
    <div class="d-flex justify-content-between align-items-center pt-3 pb-2 mb-3 border-bottom">
      <h1 class="h2">Fichajes de todos los trabajadores</h1>
    </div>

    <button type="submit"
        class="btn btn-primary w-100 my-3 py-2" (click)="exportarFichajesFiltrados()">Exportar fichajes filtrados</button>

    <!-- Filtros -->
    <div class="row g-3 mb-3">
      <div class="col-md-3">
        <input
          type="text"
          class="form-control"
          placeholder="Buscar por nombre"
          [(ngModel)]="filtroNombre"
        />
      </div>
      <div class="col-md-3">
        <select class="form-select" [(ngModel)]="filtroCasa">
          <option value="">Todas las casas</option>
          <option *ngFor="let casa of casas" [value]="casa.nombre">
            {{ casa.nombre }}
          </option>
        </select>
      </div>
      <!-- Fecha desde -->
      <div class="col-md-3">
        <input type="date" class="form-control" [(ngModel)]="filtroDesde" />
      </div>
      <!-- Fecha hasta -->
      <div class="col-md-3">
        <input type="date" class="form-control" [(ngModel)]="filtroHasta" />
      </div>
    </div>

    <!-- Tabla -->
    <div class="table-responsive">
      <table class="table table-striped table-bordered w-100">
        <thead>
          <tr>
            <th>#</th>
            <th>Trabajador</th>
            <th>Casa</th>
            <th>Hora</th>
            <th>Tipo</th>
          </tr>
        </thead>
        <tbody>
          <tr
            *ngFor="let fichaje of fichajesFiltrados"
          >
            <td>{{ fichaje.id }}</td>
            <td>
              {{ fichaje.usuario.firstName }} {{ fichaje.usuario.lastName }}
            </td>
            <td>{{ fichaje.casa.nombre }}</td>
            <td>{{ fichaje.hora | date: 'dd/MM/yyyy HH:mm:ss' }}</td>
            <td>{{ fichaje.tipo | titlecase }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</div>
