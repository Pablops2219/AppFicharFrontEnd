<div class="d-flex align-items-center py-4" cz-shortcut-listen="true">
  @if (errorMessage) {
    <div class="alert alert-danger error-message" role="alert">
      {{ errorMessage }}
    </div>
  }

  <main class="form-signin m-auto">
    <form [formGroup]="form" (ngSubmit)="register()">
      <h1 class="h3 mb-3 fw-normal">Introduzca sus datos</h1>

      <div class="form-floating">
        <input
          type="firstName"
          formControlName="firstName"
          class="form-control"
          id="floatingInput"
          placeholder="name"
        />
        <label for="floatingInput">Nombre</label>
      </div>
      <div class="form-floating">
        <input
          type="secondName"
          formControlName="secondName"
          class="form-control"
          id="floatingInput"
          placeholder="surname"
        />
        <label for="floatingInput">Apellidos</label>
      </div>
      <div class="form-floating">
        <input
          type="email"
          formControlName="email"
          class="form-control"
          id="floatingInput"
          placeholder="name@example.com"
        />
        <label for="floatingInput">Email</label>
      </div>
      <div class="form-floating">
        <input
          type="password"
          formControlName="password"
          class="form-control"
          id="floatingPassword"
          placeholder="Password"
        />
        <label for="floatingPassword">Contraseña</label>
      </div>

      <!-- <div class="form-check text-start my-3">
        <input
          class="form-check-input"
          type="checkbox"
          value="remember-me"
          id="flexCheckDefault"
        />
        <label class="form-check-label" for="flexCheckDefault">
          Remember me
        </label>
      </div> -->

      <!-- login.component.html -->
      <button type="submit" class="btn btn-primary w-100 py-2 mt-4" type="submit">
        Crear cuenta
      </button>

      <div class="my-2">
        <a href="" [routerLink]="['/login']"
          >Tienes ya una cuenta?</a
        >
      </div>
      <div class="my-2">
        <a  href="" [routerLink]="['/loginsincontra']"
          >Tienes una cuenta sin contraseña?</a
        >
      </div>
    </form>
  </main>
</div>
