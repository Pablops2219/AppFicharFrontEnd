<div
  class="d-flex flex-column flex-lg-row justify-content-between align-items-start"
>
  <!-- Contenido de formulario Fichar -->
  <div
    class="d-flex flex-column flex-md-row justify-content-center align-items-center my-5 m-auto"
  >
    <form [formGroup]="form" (ngSubmit)="fichar()" class="w-100 w-md-auto">
      <h1 class="h3 mb-3 fw-normal text-center">Fichar ahora</h1>

      <!-- Selección de Casa -->
      <div class="mb-3">
        <label for="selectCasa" class="form-label"
          >Elige una casa en la que fichar</label
        >
        <select id="selectCasa" class="form-select" formControlName="casa">
          <option value="" selected disabled>Selecciona una casa</option>
          <option *ngFor="let casa of casas" [value]="casa.id">
            {{ casa.nombre }}
          </option>
        </select>
      </div>

      <!-- Selección de Tipo (Entrada/Salida) -->
      <div class="mb-3">
        <label class="form-label">Tipo de Fichaje</label>
        <div class="form-check">
          <input
            class="form-check-input"
            type="radio"
            id="entrada"
            formControlName="tipo"
            value="entrada"
            id="flexRadioDefault1"
          />
          <label class="form-check-label" for="entrada"> Entrada </label>
        </div>
        <div class="form-check">
          <input
            class="form-check-input"
            type="radio"
            id="salida"
            formControlName="tipo"
            value="salida"
            id="flexRadioDefault2"
          />
          <label class="form-check-label" for="salida"> Salida </label>
        </div>
      </div>

      <!-- Campo de Hora con actualización en tiempo real -->
      <p class="fw-bold txt-time m-0">{{ horaActual }}</p>

      <!-- Botón de Fichar -->
      <button
        type="submit"
        class="btn btn-primary w-100 my-3 py-2"
        [disabled]="form.invalid"
      >
        Fichar
      </button>
    </form>
  </div>

  <!-- Contenido de Fichajes -->
  <main class="col-12 px-4 col-lg-9">
    <div
      class="d-flex justify-content-between align-items-center pt-3 pb-2 mb-3 border-bottom"
    >
      <h1 class="h2">Mis Fichajes</h1>
      <ul class="pagination m-0">
        <li class="page-item" [class.disabled]="paginaActual === 1">
          <button class="page-link" (click)="paginaActual = paginaActual - 1">
            Anterior
          </button>
        </li>

        <li
          class="page-item"
          *ngFor="let page of [].constructor(totalPaginas); let i = index"
          [class.active]="paginaActual === i + 1"
        >
          <button class="page-link" (click)="paginaActual = i + 1">
            {{ i + 1 }}
          </button>
        </li>

        <li
          class="page-item"
          [class.disabled]="paginaActual === totalPaginas"
        >
          <button class="page-link" (click)="paginaActual = paginaActual + 1">
            Siguiente
          </button>
        </li>
      </ul>

      <div class="btn-toolbar mb-2 mb-md-0 justify-content-end">
        <div class="btn-group me-2">
          <button type="button" class="btn btn-outline-secondary">
            Share
          </button>
          <button type="button" class="btn btn-outline-secondary">
            Export
          </button>
        </div>
      </div>
    </div>

    <div class="table-responsive small">
      <table class="table table-striped table-sm">
        <thead>
          <tr>
            <th scope="col">#</th>
            <th scope="col">Trabajador</th>
            <th scope="col">Casa ID</th>
            <th scope="col">Hora</th>
            <th scope="col">Tipo</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let fichaje of fichajesPaginados">
            <td>{{ fichaje.id }}</td>
            <td>
              {{ fichaje.usuario.firstName }} {{ fichaje.usuario.lastName }}
            </td>
            <td>{{ fichaje.casa.nombre }}</td>
            <td>{{ fichaje.hora | date : "dd/MM/yyyy HH:mm:ss" }}</td>
            <td>{{ fichaje.tipo | titlecase }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</div>
